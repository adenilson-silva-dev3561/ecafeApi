spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  application:
    name: ecafe-api

  datasource:
    url: jdbc:postgresql://localhost:5432/ecafe
    username: postgres
    password: 356132

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: true

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    eCafe.API: INFO

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

  springdoc:
    swagger-ui:
      path: /swagger
      operations-sorter: method
      tags-sorter: alpha

    api-docs:
      path: /api-docs